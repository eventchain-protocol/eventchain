# Formatting is settled here, once, so it never costs review attention.
# Non-defaults are the diff-shaped ones: a leading comma or arrow keeps a
# one-line change to one line in a diff. column-limit stays 'none' — line
# length is not a code-quality signal and is not a gate in this repo.
indentation: 4
column-limit: none
function-arrows: leading
comma-style: leading
import-export-style: leading
record-style: aligned
indent-wheres: false
record-brace-space: false
newlines-between-decls: 1
haddock-style: multi-line
let-style: auto
in-style: right-align
single-constraint-parens: auto
single-deriving-parens: auto
respectful: true
